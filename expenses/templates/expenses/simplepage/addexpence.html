<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Expense | Agroexpence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-bg: #111827;
            --main-bg: #f9fafb;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--main-bg); margin: 0; display: flex; }

        /* Sidebar Styles */
        .sidebar { width: 260px; height: 100vh; background: var(--sidebar-bg); position: fixed; left: 0; top: 0; padding: 24px; z-index: 1000; }
        .sidebar-brand { color: white; font-weight: 700; font-size: 1.25rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; text-decoration: none;}
        .sidebar-heading { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #4b5563; margin: 1.5rem 0 0.5rem; font-weight: 700; display: block;}
        .nav-link { color: #9ca3af; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; text-decoration: none; transition: 0.2s; margin-bottom: 4px; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: white; }

        /* Main Content Area */
        .main-content { margin-left: 260px; width: calc(100% - 260px); min-height: 100vh; }
        
        header { background: white; padding: 15px 30px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }

        /* Form Card */
        .form-container { max-width: 600px; margin: 40px auto; }
        .form-card { background: white; padding: 40px; border-radius: 16px; box-shadow: var(--card-shadow); border: none; }
        
        .form-label { font-weight: 600; font-size: 0.9rem; color: #374151; }
        .form-control, .form-select { padding: 12px; border-radius: 10px; border: 1px solid #d1d5db; background-color: #fcfcfc; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .btn-submit { background-color: var(--accent); color: white; padding: 12px; border-radius: 10px; font-weight: 600; border: none; transition: 0.3s; }
        .btn-submit:hover { background-color: var(--accent-hover); transform: translateY(-1px); }

        .add-cat-btn { font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; }
        
        #newCategoryDiv { background: #f3f4f6; padding: 15px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="/" class="sidebar-brand">
            <i class="fas fa-wallet text-primary"></i> Agroexpence
        </a>
        <small class="sidebar-heading">Main</small>
        <a href="{% url 'dashboard_view' %}" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
        
        <small class="sidebar-heading">Finance</small>
        <a href="{% url 'form_view' %}" class="nav-link active"><i class="fas fa-arrow-trend-down"></i> Expenses</a>
        <a href="/accounts/" class="nav-link"><i class="fas fa-university"></i> Accounts</a>
        
        <div style="position: absolute; bottom: 20px; width: 210px;">
            <a href="{% url 'logout' %}" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div class="main-content">
        <header>
            <h5 class="m-0 fw-bold">Daily Expense Entry</h5>
            <div class="d-flex align-items-center gap-3">
                <small class="text-muted">Logged in as Admin</small>
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">A</div>
            </div>
        </header>

        <div class="container content-padding">
            <div class="form-container">
                <div class="form-card">
                    <div class="text-center mb-4">
                        <i class="fas fa-receipt fa-3x text-primary mb-3"></i>
                        <h3 class="fw-bold">New Transaction</h3>
                        <p class="text-muted">Enter the details of your spending below</p>
                    </div>

                    <form id="expenseForm" data-url="{% url 'addexpence' %}">
                        {% csrf_token %}
                        <input type="hidden" id="csrf_token" value="{{ csrf_token }}" />

                        <div class="mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" id="date" name="date" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" name="category" class="form-select" required>
                                <option value="food">Food</option>
                                <option value="transport">Transport</option>
                                <option value="shopping">Shopping</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="other">Other</option>
                            </select>
                            <button type="button" class="btn btn-link add-cat-btn p-0 mt-2" onclick="showCategoryInput()">
                                <i class="fas fa-plus-circle me-1"></i> Add New Category
                            </button>
                            
                            <div id="newCategoryDiv" style="display: none;">
                                <input type="text" id="newCategoryInput" class="form-control form-control-sm mb-2" placeholder="Category Name" />
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-primary btn-sm px-3" onclick="addNewCategory()">Add</button>
                                    <button type="button" class="btn btn-light btn-sm px-3" onclick="document.getElementById('newCategoryDiv').style.display='none'">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount (₹)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">₹</span>
                                <input type="number" id="amount" name="amount" class="form-control border-start-0" placeholder="0.00" min="0" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">Description (Optional)</label>
                            <textarea id="description" name="description" class="form-control" rows="3" placeholder="What did you buy?"></textarea>
                        </div>

                        <button type="submit" class="btn btn-submit w-100 shadow-sm">
                            <i class="fas fa-check-circle me-2"></i> Save Expense
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();

        document.getElementById("expenseForm").addEventListener("submit", function (event) {
            event.preventDefault();
            let form = event.target;
            let apiUrl = form.getAttribute("data-url");

            let expenseData = {
                date: document.getElementById("date").value,
                category: document.getElementById("category").value,
                amount: document.getElementById("amount").value,
                description: document.getElementById("description").value,
            };

            fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": document.getElementById("csrf_token").value,
                },
                body: JSON.stringify(expenseData),
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("✅ Expense saved successfully!");
                    window.location.href = "/expenses/dashboard_view/";
                } else {
                    alert("❌ Error: " + data.error);
                }
            })
            .catch(err => console.error("Error:", err));
        });

        function showCategoryInput() {
            document.getElementById("newCategoryDiv").style.display = "block";
            document.getElementById("newCategoryInput").focus();
        }

        function addNewCategory() {
            const input = document.getElementById("newCategoryInput");
            const val = input.value.trim();
            if(!val) return;

            const select = document.getElementById("category");
            const opt = document.createElement("option");
            opt.value = val.toLowerCase();
            opt.text = val;
            select.add(opt);
            select.value = opt.value;
            
            input.value = "";
            document.getElementById("newCategoryDiv").style.display = "none";
        }
    </script>
</body>
</html>
