<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            display: flex;
            transition: all 0.3s ease;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #343a40;
            color: white;
            padding-top: 20px;
            position: fixed;
            left: 0;
            transition: all 0.3s ease-in-out;
        }
        .sidebar a {
            display: block;
            padding: 10px;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .sidebar a:hover {
            background: #495057;
        }
        .sidebar.hidden {
            left: -250px;
        }
        .main-content {
            margin-left: 260px;
            padding: 20px;
            width: 100%;
            transition: margin-left 0.3s ease-in-out;
        }
        .main-content.expanded {
            margin-left: 10px;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            left: 260px;
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            transition: left 0.3s ease-in-out;
        }
        .toggle-btn.collapsed {
            left: 10px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h3 class="text-center">Dashboard</h3>
        <a onclick="loadPage('profile')">Profile</a>
        <a onclick="loadPage('reports')">Reports</a>
        <a onclick="loadPage('expenses')">Expenses</a>
        <a onclick="loadPage('settings')">Settings</a>
    </div>

    <!-- Toggle Button -->
    <button class="toggle-btn" id="toggleBtn">☰</button>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <div id="content">
            <h2>Welcome to Your Dashboard</h2>
            <p>Select a menu option from the sidebar.</p>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const sidebar = document.getElementById("sidebar");
        const toggleBtn = document.getElementById("toggleBtn");
        const mainContent = document.getElementById("mainContent");

        // Sidebar Toggle Functionality
        toggleBtn.addEventListener("click", function () {
            sidebar.classList.toggle("hidden");
            mainContent.classList.toggle("expanded");
            toggleBtn.classList.toggle("collapsed");
        });

        // Function to Load Pages Dynamically
        function loadPage(page) {
            const content = document.getElementById("content");

            if (page === "profile") {
                content.innerHTML = `
                    <h2>Profile</h2>
                    <p>Manage your profile details here.</p>
                    <div class="card p-3">
                        <h5>Name: John Doe</h5>
                        <h5>Email: johndoe@example.com</h5>
                        <h5>Role: Admin</h5>
                    </div>
                `;
            } else if (page === "reports") {
                content.innerHTML = `
                    <h2>Reports</h2>
                    <p>View and analyze your reports here.</p>
                    <canvas id="reportChart"></canvas>
                `;
                setTimeout(loadReportChart, 200);
            } else if (page === "expenses") {
                content.innerHTML = `
                    <h2>Expenses</h2>
                    <p>Track your expenses.</p>
                    <canvas id="expenseChart"></canvas>
                `;
                setTimeout(loadExpenseChart, 200);
            } else if (page === "settings") {
                content.innerHTML = `
                    <h2>Settings</h2>
                    <p>Adjust your preferences and account settings.</p>
                    <button class="btn btn-primary">Change Password</button>
                    <button class="btn btn-danger">Delete Account</button>
                `;
            }
        }

        // Load Sample Charts
        function loadReportChart() {
            new Chart(document.getElementById("reportChart"), {
                type: "line",
                data: {
                    labels: ["Jan", "Feb", "Mar", "Apr", "May"],
                    datasets: [{
                        label: "Reports",
                        data: [10, 25, 15, 30, 20],
                        backgroundColor: "rgba(0, 123, 255, 0.5)"
                    }]
                }
            });
        }

        function loadExpenseChart() {
            new Chart(document.getElementById("expenseChart"), {
                type: "bar",
                data: {
                    labels: ["Rent", "Food", "Transport", "Entertainment", "Others"],
                    datasets: [{
                        label: "Expenses",
                        data: [5000, 3000, 1500, 2000, 1000],
                        backgroundColor: ["blue", "green", "red", "purple", "orange"]
                    }]
                }
            });
        }

        // Expose function to global scope
        window.loadPage = loadPage;
    });
</script>

</body>
</html>
