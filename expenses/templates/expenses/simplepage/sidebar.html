<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Systematic Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --primary-accent: #4361ee;
            --dark-bg: #1a1c23;
            --nav-item-hover: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: #f4f7fe;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--dark-bg);
            color: #94a3b8;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
        }

        .sidebar-brand {
            padding: 30px 25px;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Module Labels */
        .sidebar-label {
            padding: 20px 25px 10px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #4b5563;
            letter-spacing: 1.5px;
        }

        .nav-link {
            padding: 12px 25px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s;
            margin: 2px 15px;
            border-radius: 10px;
        }

        .nav-link i {
            width: 25px;
            font-size: 1.1rem;
            margin-right: 15px;
            transition: transform 0.2s;
        }

        .nav-link:hover {
            background: var(--nav-item-hover);
            color: white;
        }

        .nav-link:hover i {
            transform: scale(1.1);
            color: var(--primary-accent);
        }

        .nav-link.active {
            background: var(--primary-accent);
            color: white;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }

        /* Collapse Logic */
        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .main-content {
            flex-grow: 1;
            margin-left: var(--sidebar-width);
            padding: 30px;
            transition: all 0.3s ease;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        /* Floating Toggle Button */
        .toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: var(--dark-bg);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.3s ease;
        }

        .toggle-btn.collapsed-state {
            left: 20px;
        }

        .sidebar:not(.collapsed) ~ .toggle-btn {
            left: 275px; /* Position next to open sidebar */
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-layer-group text-primary me-2"></i>AgroPTE
        </div>

        <div class="sidebar-label">Core View</div>
        <a href="{% url 'todo_dashboard' %}" class="nav-link active">
            <i class="fas fa-chart-line"></i> Dashboard
        </a>
        <a href="#" class="nav-link">
            <i class="fas fa-wallet"></i> Expenses
        </a>

        <div class="sidebar-label">Todo Module</div>
        <a href="{% url 'todo_list' %}" class="nav-link">
            <i class="fas fa-clipboard-list"></i> Task List
        </a>
        <a href="{% url 'todo_add' %}" class="nav-link">
            <i class="fas fa-plus-circle"></i> Add Task
        </a>
        <a href="#" class="nav-link">
            <i class="fas fa-calendar-check"></i> Schedule
        </a>

        <div class="sidebar-label">Reports</div>
        <a href="#" class="nav-link">
            <i class="fas fa-file-invoice-dollar"></i> Analytics
        </a>
        <a href="#" class="nav-link">
            <i class="fas fa-cog"></i> Settings
        </a>
    </div>

    <button class="toggle-btn" id="toggleBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="main-content" id="mainContent">
        <div class="container-fluid pt-5">
            <h2 class="fw-bold">Welcome back, Admin</h2>
            <p class="text-muted">Manage your systematic tracker from the sidebar module.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const sidebar = document.getElementById("sidebar");
            const toggleBtn = document.getElementById("toggleBtn");
            const mainContent = document.getElementById("mainContent");

            toggleBtn.addEventListener("click", function () {
                sidebar.classList.toggle("collapsed");
                mainContent.classList.toggle("expanded");
                
                // Switch Icon
                const icon = toggleBtn.querySelector('i');
                if (sidebar.classList.contains('collapsed')) {
                    icon.classList.replace('fa-bars', 'fa-arrow-right');
                } else {
                    icon.classList.replace('fa-arrow-right', 'fa-bars');
                }
            });
        });
    </script>
</body>
</html>
