<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h5 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        .dashboard {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 200px;
            padding: 20px;
            text-align: center;
        }
        .card h3 {
            font-size: 18px;
            color: #444;
            margin-bottom: 15px;
        }
        .card button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .card button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h5>Dashboard</h5>
    <div class="dashboard">
        <div class="card">
            <h3>Expense</h3>
            <button>Manage</button>
        </div>
        <div class="card">
            <h3>Task</h3>
            <button>Manage</button>
        </div>
        <div class="card">
            <h3>Project</h3>
            <button>Manage</button>
        </div>
        <div class="card">
            <h3>Employee</h3>
            <button>Manage</button>
        </div>
        <div class="card">
            <h3>Study</h3>
            <button>Manage</button>
        </div>
    </div>
</body>
</html>
