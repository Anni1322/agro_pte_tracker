<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Agroexpence | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --text-main: #1f2937;
            --bg-soft: #f4f7fe;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-soft);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .signup-container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border-radius: 12px;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        h2 {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #6b7280;
            font-size: 0.9rem;
        }

        /* Styling Django Form Elements */
        form p {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"], 
        input[type="password"], 
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background-color: #f9fafb;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .helptext {
            display: block;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 4px;
            line-height: 1.4;
        }

        ul.errorlist {
            padding: 0;
            margin: 0 0 15px 0;
            list-style: none;
            color: #ef4444;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .btn-signup {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-signup:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .footer-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-header">
            <div class="brand-logo">
                <i class="fas fa-leaf"></i>
            </div>
            <h2>Create your account</h2>
            <p class="subtitle">Join Agroexpence to manage your daily costs</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            
            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-signup">
                Get Started
            </button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Target all inputs in the form
            const inputs = document.querySelectorAll('.form-fields input');
            inputs.forEach(input => {
                // Add placeholder text based on the label if needed
                // input.placeholder = "Enter your " + input.name;
            });
        });
    </script>
</body>
</html>
