{% extends 'base.html' %}

{% block title %}Delete Task | Agro Tracker{% endblock %}
{% block page_title %}Remove Task{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center max-w-500 mx-auto">
        <div class="mb-4 text-danger">
            <i class="fas fa-exclamation-triangle fa-4x"></i>
        </div>
        <h4 class="fw-bold mb-3">Delete Task?</h4>
        <p class="text-muted mb-4">Are you sure you want to delete task <strong>{{ task.title }}</strong>? This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'task_list' %}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                <button type="submit" class="btn btn-danger px-4 rounded-pill">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
