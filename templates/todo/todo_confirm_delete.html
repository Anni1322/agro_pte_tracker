<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .delete-card { border: none; border-radius: 20px; overflow: hidden; }
        .icon-box {
            width: 80px;
            height: 80px;
            background: #fff5f5;
            color: #ff4d4d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }
        .btn-confirm { border-radius: 10px; padding: 12px 30px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card delete-card shadow-lg text-center">
                <div class="card-body p-5">
                    <div class="icon-box">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    
                    <h3 class="fw-bold text-dark">Are you sure?</h3>
                    <p class="text-muted mb-4">
                        You are about to delete the task: <br>
                        <strong class="text-danger">"{{ todo.title }}"</strong>. <br>
                        This action cannot be undone.
                    </p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-confirm shadow-sm">
                                <i class="fas fa-trash-alt me-2"></i>Yes, Delete Task
                            </button>
                            <a href="{% url 'todo_list' %}" class="btn btn-light btn-confirm">
                                No, Keep It
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <a href="{% url 'todo_dashboard' %}" class="text-decoration-none text-muted small">
                    <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
